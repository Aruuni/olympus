name: random_bw_rtt_15s_300s
description: One flow with reproducible random BW/RTT changes every 15 seconds.
shuffle: false
sweep:
  bws: [50]
  delays: [50]
  flows: [1]
  duration: 300
  bdp_mult: [4]
  link_schedule_generator:
    interval_s: 15
    sample_initial: true
    bw: {uniform: [10, 100]}
    delay: {uniform: [10, 100]}
