# Two-flow inter-RTT fairness heatmap benchmark.
#
# Flow 1 has a FIXED RTT (fixed_flow_rtt_ms, default 20 ms), starts at t=0s
# and runs for the full 60s episode.
# Flow 2 has a VARYING RTT (one value per rtt_ms_values entry) and joins at
# t=20s, running until t=60s.
# Metrics (goodput ratio) are scored from the final 20 seconds.
#
approaches_config: ../config.yaml
output_root: data

benchmark:
  name: inter_rtt_fairness_two_flow_join20_final20
  duration_s: 60
  first_flow_start_s: 0
  second_flow_start_s: 20
  score_window_s: 20
  runs_per_cell: 4
  n_parallel: 20
  fixed_flow_rtt_ms: 20
  bw_mbps_values: [20, 40, 60, 80, 100]
  rtt_ms_values: [20, 40, 60, 80, 100]
  bdp_mult: [4]
  measure_interval_s: 1.0
  kernel_cport_base: 53000
  plot_episodes: true
  cwnd_ylim_percentile: 99.0
  cwnd_ylim_headroom: 1.15
  deterministic_inference: true
  seed_offset: 0
