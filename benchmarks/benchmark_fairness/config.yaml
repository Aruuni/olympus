# Two-flow fairness heatmap benchmark.
#
# Flow 1 starts at t=0s and runs for the full 60s episode.
# Flow 2 joins at t=20s and runs until t=60s.
# Metrics are scored from the final 20 seconds.
#
approaches_config: ../config.yaml
output_root: data

benchmark:
  name: fairness_two_flow_join20_final20
  duration_s: 60
  first_flow_start_s: 0
  second_flow_start_s: 20
  score_window_s: 20
  runs_per_cell: 4
  n_parallel: 20
  bw_mbps_values: [20, 40, 60, 80, 100]
  rtt_ms_values: [20, 30, 40, 50, 60, 70]
  bdp_mult: 4
  measure_interval_s: 1.0
  kernel_cport_base: 53000
  plot_episodes: true
  cwnd_ylim_percentile: 99.0
  cwnd_ylim_headroom: 1.15
  deterministic_inference: true
  seed_offset: 0
