  # Kernel congestion-control baselines. These run iperf3 directly with
  # `-C <kernel_cc>` and do not start an Olympus listener or load a checkpoint.
  - data_folder: cubic
    kind: kernel
    kernel_cc: cubic
    plot_label: CUBIC

  - data_folder: bbr
    kind: kernel
    kernel_cc: bbr
    plot_label: BBRv3

  - data_folder: bbr1
    kind: kernel
    kernel_cc: bbr1
    plot_label: BBRv1

  - data_folder: frcc
    kind: kernel
    kernel_cc: frcc
    plot_label: FRCC

  # Astraea RL agent. `kind: astraea` starts the astraea_listener daemon
  # (cc_name "astraea") with its TF1 venv; it does not load an Olympus
  # checkpoint and needs no kernel_cc. Build the listener once with
  # `gcc -O2 -Wall -o astraea_listener astraea_listener.c` and place the
  # interpreter at astraea/venv_astraea/bin/python (or set $ASTRAEA_PYTHON).
  - data_folder: astraea
    kind: astraea
    plot_label: Astraea

  # Astraea recreation trained in Olympus (multi-agent TD3 learner in
  # olympus/algorithms/ma_td3). Unlike `kind: astraea` above — which runs the
  # released TF1 agent via the listener daemon — this loads an Olympus
  # checkpoint like any other learned model. The learner is `ma_td3`; its
  # state/reward/action/environment components remain named `astraea`.
  - data_folder: astraea-olympus
    name: astraea-olympus
    kind: model
    algorithm: ma_td3
    state: astraea
    reward: astraea
    environment: astraea
    plot_label: Astraea (Olympus)
    config: olympus/astraea.yaml
    checkpoint: olympus/models/ma_td3_20260717-152353/checkpoints/ma_td3_1800_cwnd_model.pt

  # Orca recreation trained in Olympus (single-agent TD3 learner in
  # olympus/algorithms/orca). Loads an Olympus checkpoint like any other
  # learned model; its state/reward/action/environment components are named
  # orca (olympus/orca.yaml).
  - data_folder: orca-olympus
    name: orca-olympus
    kind: model
    algorithm: orca
    state: orca_repo
    reward: orca
    environment: dynamic
    plot_label: Orca (Olympus)
    config: olympus/orca.yaml
    checkpoint: olympus/models/reps/orca_20260718-165340/checkpoints/orca_1200_cwnd_model.pt

# Curated subset every benchmark draws into its `*_specific` comparison plot,
# alongside the usual all-approaches output. Each benchmark filters its
# completed runs down to these data folders and writes a parallel report:
#   responsive_fairness -> aggregate_specific/ (all.pdf-style overlay)
#   responsiveness       -> a "Specific Subset" page in responsiveness_summary.pdf
#   fairness / inter_rtt -> fairness_heatmap_specific.pdf
#   convergence_4flow    -> convergence_summary_specific.pdf + efficiency_specific.pdf
# Names are data_folder values from the approaches list above: the four kernel
# baselines, Astraea, and the 0.995-gamma credit MA-Dreamer. Drop the list (or
# leave it empty) to disable the extra plots.
specific_plots:
  - ma_dreamer_general
  - ma_dreamer_20260615-022803
  - cubic
  - bbr
  - bbr1
  - frcc
  - astraea
  - astraea-olympus
  - orca-olympus
