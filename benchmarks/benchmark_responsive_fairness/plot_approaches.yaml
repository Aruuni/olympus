# Curated approach list for the responsive-fairness aggregate plots.
#
# plot.py reads this file (hardcoded as the default) to decide WHICH data
# folders under data/ are drawn into all.pdf and the other aggregate reports,
# and which plot label to use for each. It is intentionally separate from
# benchmarks/config.yaml: that file controls what gets *run/measured*, this one
# controls what gets *plotted*. Drop an entry here to hide a stale data folder
# from the plots without deleting its data; add one to surface it.
#
# Only data_folder (the storage folder name under data/) and plot_label are
# used. Entries whose data folder has no completed runs yet are simply skipped.
# Override on the command line with `plot.py --plot-config <other.yaml>`.

approaches:
  - data_folder: ma_dreamer_20260615-022803
    plot_label: MA-Dreamer / Tempest / Team fairness + credit + 0.995 gamma

  - data_folder: ma_dreamer_20260611-001404
    plot_label: MA-Dreamer / Tempest / Team fairness

  - data_folder: sa_dreamer_20260521-145020
    plot_label: Single-Agent Dreamer / Tempest / Kalman

  - data_folder: self_play_dreamer_20260525-152636
    plot_label: Self-Play Dreamer / Tempest Fairness / Staggered Flows

  - data_folder: ma_dreamer_20260611-175726
    plot_label: MA-Dreamer / Tempest / Team fairness

  - data_folder: ma_dreamer_symmetrical
    plot_label: MA-Dreamer / Tempest / Team fairness + symetrical

  - data_folder: ma_dreamer_credit
    plot_label: MA-Dreamer / Tempest / Team fairness + credit

  - data_folder: cubic
    plot_label: CUBIC

  - data_folder: bbr
    plot_label: BBRv3

  - data_folder: bbr1
