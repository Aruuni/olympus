# Intra-RTT fairness sub-config (IFIP 2026, Figure 5).
#
# Inherits shared benchmark params + the full approach list from the master
# config; only the intra-RTT suite block and output_root live here.  Both flows
# share the swept RTT at a 1x BDP queue (no link outages).

approaches_config: ../config.yaml
output_root: data

benchmark:
  bandwidth_mbps: 100
  rtt_ms_values: [20, 40, 60, 80, 100, 120, 140, 160, 180, 200]
  runs_per_cell: 5
  duration_s: 200
  first_flow_start_s: 0
  second_flow_start_s: 50
  score_window_s: 100
  measure_interval_s: 1.0
  n_parallel: 10
  kernel_cport_base: 55000
  deterministic_inference: true
  tcp_buffer_multiplier: 22
  disable_offload: true

  intra_rtt:
    bdp_multipliers: [2]
