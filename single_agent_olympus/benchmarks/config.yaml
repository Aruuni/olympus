  - data_folder: mbpo_td3_sage_min_rtt_dynamic
    algorithm: mbpo_td3
    state: min_rtt
    reward: sage_min_rtt
    environment: dynamic
    plot_label: Sage Original Reward
    checkpoint: single_agent_olympus/data/mbpo_td3_sage_min_rtt_dynamic/checkpoints/mbpo_td3_cwnd_model.pt

  # Astraea baseline: the benchmark runner spawns astraea_listener once per
  # approach, then runs iperf flows with `-C astraea`. The listener attaches
  # to each flow, runs inference, and each per-flow Python child auto-exits
  # after `astraea.idle_exit_ms` (default 500ms) of no progress on bytes_sent.
  - data_folder: astraea
    kind: astraea
    algorithm: astraea
    state: kernel
    reward: none
    environment: dynamic
    plot_label: Astraea
    astraea:
      binary: astraea_listener
      script: astraea_service.py
      config: astraea/astraea.json
      model: astraea/models/py
      idle_exit_ms: 500
      scan_ms: 10

  # Real Orca baseline (the original SIGCOMM'20 C++/TF1 implementation, NOT
  # the `orca` PyTorch re-creation above). No iperf3/RL listener: each sender
  # c{i} runs orca-server-mahimahi (data source + a TF1 actor) via sender.sh
  # and each receiver x{i} runs clientThr via receiver.sh, exactly as
  # cctestbed launches them (wrapped in `sudo -u <user>`). clientThr's
  # per-interval throughput is parsed into the same csvs/x{f}.csv the iperf3
  # path produces, so all metrics/plots are unchanged. clientThr does not
  # report RTT, so RTT-derived metrics are NaN for this approach. The TF1
  # actor needs a slow warmup (model load) before the duration timer starts;
  # `orca.warmup_slack_s` adds wall time for it and the leading idle prefix
  # is trimmed so Orca's active window aligns with the benchmark window.
  # Orca is heavy (a TF1 python actor per concurrent flow) -- lower the
  # benchmark's n_parallel if the host can't sustain slots*flows actors.
  - data_folder: orca_real
    kind: orca
    algorithm: orca
    state: kernel
    reward: none
    environment: dynamic
    plot_label: Orca (original)
    orca:
      install_dir: /its/home/mm2350/Desktop/mininettestbed/CC/Orca
      port_base: 47000
      warmup_slack_s: 60
      server_lead_s: 1.0
      warmup_trim: true
      warmup_trim_eps_mbps: 0.05



    
