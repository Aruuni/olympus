# Shared benchmark approach catalog.
#
# This file lists the trained approaches that benchmark_responsiveness,
# benchmark_convergence, and future benchmark folders can reuse.
#
# Set `data_folder` on each entry when you want a stable benchmark data folder.
# If `data_folder`
# is omitted, the older behavior is used: `name`, then
# <algorithm>_<state>_<reward>_<environment>.
# Benchmark runners now run every listed/selected approach whose data folder
# does not already contain a populated metrics.csv.

base_config: ../config.yaml

approaches:
  # Fill in one entry per trained model. `data_folder` is the benchmark data
  # folder under output_root. `plot_label` is only used in graph legends.

