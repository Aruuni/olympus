    state: kalman
    reward: sage
    environment: dynamic
    plot_label: MBPO-TD3 / Kalman State / SAGE / dynamic
    checkpoint: single_agent_olympus/data/mbpo_td3_kalman_sage_dynamic_new/checkpoints/mbpo_td3_cwnd_model.pt

