    environment: dynamic
    plot_label: MBPO-TD3 / Kalman State / Tempest (sparse) / dynamic
    checkpoint: single_agent_olympus/data/mbpo_td3_kalman_sage_dynamic_sparse/checkpoints/mbpo_td3_cwnd_model.pt




# STATIC 
  - data_folder: mbpo_td3_kalman_kalman_fit_static
    algorithm: mbpo_td3
    state: kalman
    reward: kalman_fit
    environment: static
    plot_label: MBPO-TD3 / Kalman State / Kalman-Fit / static
    checkpoint: single_agent_olympus/data/mbpo_td3_kalman_kalman_fit_static/checkpoints/mbpo_td3_cwnd_model.pt



