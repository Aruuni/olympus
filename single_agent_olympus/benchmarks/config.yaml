  - data_folder: mbpo_td3_sage_probe_dynamic
    algorithm: mbpo_td3
    state: kalman
    reward: sage
    environment: dynamic
    plot_label: MBPO-TD3 / Kalman State / Tempest + bbr3 probe / dynamic
    checkpoint: single_agent_olympus/data/mbpo_td3_sage_probe_dynamic/checkpoints/mbpo_td3_cwnd_model.pt


