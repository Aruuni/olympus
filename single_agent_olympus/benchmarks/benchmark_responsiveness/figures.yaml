# Figure definitions for plot_figures.py.
#
# Each entry produces one 3-panel PDF (Goodput CDF | SRTT CDF | Retransmissions CDF)
# under <output_root>/figures/<name>.pdf, drawing every data_folder listed.
#
# data_folder values must match the data_folder fields in benchmarks/config.yaml;
# the script pulls the plot_label from there automatically. Approaches inside a
# figure are sorted alphabetically by data_folder.
#
# Run with:
#   sudo -E env PATH="$PATH" HOME="$HOME" ./venv_training/bin/python single_agent_olympus/benchmarks/benchmark_responsiveness/plot_figures.py

figures:
  - name: oracle_vs_kalman
    description: Kalman State VS ORACLE, both with tempest and dynamic environment.
    data_folders:
      - oracle
      - mbpo_td3_sage_probe_dynamic
      - mbpo_td3_kalman_sage_dynamic
      - mbpo_td3_kalman_sage_dynamic_sparse
      - mbpo_td3_sage_min_rtt_dynamic

  - name: probe_ablation
    description: MBPO-TD3 / Sage with the BBR probe vs. ORACLE.
    data_folders:
      - mbpo_td3_sage_probe_dynamic
      - oracle



  - name: mpbo_benefit
    description: MBPO-TD3 VS TD3 
    data_folders:
      - mbpo_td3_sage_probe_dynamic
      - oracle
