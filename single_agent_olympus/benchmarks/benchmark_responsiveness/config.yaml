# Fixed-output responsiveness benchmark.
#
# Approach definitions live in ../config.yaml so future benchmarks can reuse
# the same trained-model catalog.
#
# sudo -E env PATH="$PATH" HOME="$HOME" ./venv_training/bin/python single_agent_olympus/benchmarks/benchmark_responsiveness/responsiveness.py --config single_agent_olympus/benchmarks/benchmark_responsiveness/config.yaml 
#   --approach mbpo_td3_kalman_reference_all

approaches_config: ../config.yaml
base_config: ../../config.yaml
output_root: data

benchmark:
  name: random_bw_rtt_15s_300s
  runs: 50
  n_parallel: 50
  duration_s: 300
  change_interval_s: 15
  bw_min_mbps: 10
  bw_max_mbps: 100
  rtt_min_ms: 10
  rtt_max_ms: 100
  seed_offset: 0
  flows: 1
  bdp_mult: 4
  measure_interval_s: 1.0
  kernel_cport_base: 33000
  plot_episodes: true
  deterministic_inference: true
