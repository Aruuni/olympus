runtime:
  algorithm: orca
  reward: sage
  state: default_orca
  action: cwnd_multiplier

actions:
  cwnd_multiplier:
    action_min: -1.0
    action_max: 1.0
    multiplier_min: 0.25
    multiplier_max: 4.0
    min_cwnd_change: 1

environment:
  type: raynet
  environment_setup: orca_static

reward:
  delay_margin_coef: 1.25

state_options:
  orca_target_ms: 50.0

paths:
  py: ./venv_training/bin/python

outputs:
  root: olympus/models/orca
  run_name: full_sweep
  plot_episodes: false

n_parallel: 15
episodes: 160000

algorithms:
  orca:
    training:
      resume_from: null
      batch_size: 8
      min_replay: 10000
      replay_capacity: 10240
      gamma: 0.995
      target_tau: 0.001
      lr_actor: 1.0e-4
      lr_critic: 1.0e-3
      actor_update_every: 1
      target_noise_std: 0.1
      target_noise_clip: 0.2
      grad_clip: 0.0
      updates_per_step: 1
      save_every: 100000
      save_every_episodes: 0
      param_broadcast_every: 1
      update_delay_ms: 20
      persist_replay_on_stop: false
    agent:
      hidden: 64
      head_hidden: 64
      interval_ms: 20
      cwnd_min: 4
      cwnd_max: 10000
      noise_std: 0.0
      noise_start: 0.0
      noise_end: 0.0
      noise_decay_episodes: 1
