# Astraea recreation (EuroSys '24, Liao et al.) — full training configuration.
#
# Run:
#   sudo mn -c
#   sudo -E env PATH="$PATH" HOME="$HOME" python3 olympus/orchestrator.py --config olympus/astraea.yaml
#
# Everything is named astraea: the multi-agent TD3 learner
# (olympus/algorithms/astraea), the 10-feature local state
# (olympus/states/astraea.py — the released agent's transform), the global
# convergence reward (olympus/rewards/astraea.py worker side, Eq. 8 assembled
# in the learner), the +/-2.5% relative-cwnd action (olympus/actions/astraea.py),
# and the multi-flow environment (olympus/environments/mininet/astraea.yaml,
# paper Table 3 ranges). Hyperparameter defaults follow the released
# astraea.json where the paper is silent.

runtime:
  algorithm: astraea
  reward: astraea
  state: astraea
  action: astraea

actions:
  # Original Astraea action (paper Eq. 3): a in (-1, 1),
  # cwnd <- cwnd*(1 + alpha*a) for a >= 0, cwnd/(1 - alpha*a) otherwise,
  # with alpha = step = 0.025.
  astraea:
    action_min: -1.0
    action_max: 1.0
    step: 0.025

environment:
  type: mininet
  environment_setup: astraea

# Global reward defaults are unused by the astraea reward plugin (it reads the
# algorithms.astraea.reward block below); kept for config-shape compatibility.
reward: {}

# BBR-style probe stays off: Astraea's agent has full cwnd control.
bbr_probe:
  enabled: false
  interval_s: 5.0
  duration_s: 0.2
  factor: 0.5
  min_rtt_window_s: 5.0

state_options: {}

paths:
  listener: olympus/oc_bridge
  py: ./venv_training/bin/python

outputs:
  root: olympus/models
  # run_name: astraea_recreation
  plot_episodes: true

orchestrator:
  n_parallel: 20
  episodes: 5000
  save_every_episodes: 500
  learner_port: 6301
  scan_ms: 20
  listener_single_flow: true
  listener_state_pipe: false
  # The kernel module that hands cwnd control to the agent.
  listener_cc: astraea
  cport_base: 23000

algorithms:

  astraea:
    training:
      resume_from: null
      # Off-policy TD3 (the paper's MADDPG variant). Values from the tech
      # report's Table 4 (training parameters), astraea.json for the rest.
      # batch_size counts sampled joint windows; each contributes up to
      # `flows` per-agent transitions (~2-5x); 64 joint windows produce a
      # paper-sized batch near 192 transitions at the average flow count.
      batch_size: 64
      min_replay: 20000
      replay_capacity: 400000      # astraea.json memsize
      gamma: 0.98                  # Table 4 gamma
      target_tau: 0.005            # astraea.json tau
      # Released astraea.json uses a much slower actor than critic.  Keeping
      # these distinct is essential: 1e-3 on the actor drives its tanh output
      # from one saturated boundary to the other instead of converging.
      lr_actor: 5.0e-5
      lr_critic: 1.0e-3
      # The released learner starts delayed actor updates as soon as replay
      # training starts; it has no additional critic-only warm-up phase.
      actor_warmup_steps: 0
      # Diagnostic only: warn loudly if the deterministic actor again combines
      # negative saturation with low utilization and CWND-floor lock.
      collapse_monitor:
        enabled: true
        utilization_threshold: 0.05
        cwnd_floor_fraction: 0.90
        negative_action_threshold: -0.90
        negative_action_fraction: 0.90
        patience: 5
      policy_delay: 20             # astraea.json policy_delay
      # Table 4 training cadence: `model update step` (20) gradient
      # iterations every `model update interval` (5 s). Set the interval to 0
      # for continuous updates (updates_per_step per loop) instead.
      model_update_interval_s: 0
      model_update_steps: 20
      # Target policy smoothing exactly as in the released agent
      # (get_target_actor_policy: N(0, 0.05) clipped to +/-0.1).
      target_noise_std: 0.05
      target_noise_clip: 0.1
      # 0 disables gradient clipping (the original agent used none).
      grad_clip: 0.0
      # In continuous mode (interval 0) the loop alternates queue-drain and
      # this many gradient steps; 4 keeps drains frequent enough while not
      # pausing between every single update.
      updates_per_step: 4
      worker_push_every: 16
      save_every: 500
      param_broadcast_every: 50
      torch_threads: 4
      torch_interop_threads: 1
    agent:
      # Actor/critic widths: 3-layer MLP h1 -> h2 -> ceil(h2/2)
      # (astraea.json h1_shape/h2_shape; paper says 256/128/64).
      hidden: 256
      hidden2: 128
      # Released Astraea actor: BatchNorm after each hidden dense layer.
      actor_norm: batchnorm
      # w — MTPs of stacked local-state history (astraea.json rec_dim) and
      # the window of the fairness/stability reward metrics (Eq. 6-7).
      history_len: 5
      # Monitoring Time Period: Table 4 trains at 30ms (the deployed
      # inference service acts at 20ms).
      interval_ms: 30
      cwnd_min: 10
      cwnd_max: 10000
      dead_flow_ms: 500
      # Released Astraea noise_type=0: with epsilon probability, replace the
      # actor output with U(-1, 1). Small action-index blocks are leased from
      # the learner so a new episode does not reset exploration.
      #
      # random_exploration_steps is PER ACTOR (the original's 1.5M budget was
      # per one of its ~2 actor processes). The effective global budget is
      # random_exploration_steps * random_exploration_actors; 'auto' scales by
      # this run's concurrency (n_parallel slots x mean sweep flows = ~60), so
      # epsilon decays over hours as intended rather than burning out in ~15
      # minutes when 60 flows drain one shared 1.5M counter (the
      # astraea_20260714-070159 failure). At ~2000 actions/s globally the
      # auto-scaled budget (~90M) reaches the 0.05 floor after ~12.5h; lower
      # random_exploration_steps for a shorter random phase.
      exploration_mode: random_replacement
      random_exploration_steps: 1500000
      random_exploration_actors: auto
      random_epsilon_end: 0.05
      exploration_allocation_block: 256
    reward:
      # Paper Eq. 8 coefficients, confirmed by the tech report's Table 4:
      #   R = c0*R_thr - c1*R_lat - c2*R_loss - c3*R_fair - c4*R_stab
      # bounded to (-reward_clip, reward_clip). The paper reports the fairness
      # coefficient is robust in [0.05, 0.35] relative to c0.
      throughput_weight: 0.1    # c0
      latency_weight: 0.02      # c1
      loss_weight: 1.0          # c2
      fairness_weight: 0.02     # c3
      stability_weight: 0.01    # c4
      # beta in the (1+beta)*d0 latency threshold; d0 = the flow's observed
      # min_rtt (beta itself is not published in the paper/Table 4).
      delay_coefficient: 0.5
      reward_clip: 0.1
