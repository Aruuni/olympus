# MA-TD3 learner with Astraea components (EuroSys '24, Liao et al.).
#
# Run:
#   sudo mn -c
#   sudo -E env PATH="$PATH" HOME="$HOME" python3 olympus/orchestrator.py --config olympus/astraea.yaml
#
# The learner is named for its architecture (olympus/algorithms/ma_td3).
# Its Astraea-specific components retain their protocol names: the 10-feature
# local state
# (olympus/states/astraea.py — the released agent's transform), the global
# convergence reward (olympus/rewards/astraea.py worker side, Eq. 8 assembled
# in the learner), the +/-2.5% relative-cwnd action (olympus/actions/astraea.py),
# and the multi-flow environment (olympus/environments/mininet/astraea.yaml,
# paper Table 3 ranges). Hyperparameter defaults follow the released
# astraea.json where the paper is silent.

runtime:
  algorithm: ma_td3
  reward: astraea
  state: astraea
  action: astraea

actions:
  # Original Astraea action (paper Eq. 3): a in (-1, 1),
  # cwnd <- cwnd*(1 + alpha*a) for a >= 0, cwnd/(1 - alpha*a) otherwise,
  # with alpha = step = 0.025.
  astraea:
    action_min: -1.0
    action_max: 1.0
    step: 0.025

environment:
  type: mininet
  environment_setup: astraea

# Global reward defaults are unused by the astraea reward plugin (it reads the
# algorithms.ma_td3.reward block below); kept for config-shape compatibility.
reward: {}

# BBR-style probe stays off: Astraea's agent has full cwnd control.
bbr_probe:
  enabled: false
  interval_s: 5.0
  duration_s: 0.2
  factor: 0.5
  min_rtt_window_s: 5.0

state_options: {}

paths:
  listener: olympus/oc_bridge
  py: ./venv_training/bin/python

outputs:
  root: olympus/models/reps
  # run_name: ma_td3_astraea_recreation
  plot_episodes: true

orchestrator:
  n_parallel: 8
  episodes: 1000
  save_every_episodes: 25
  learner_port: 6301
  scan_ms: 20
  listener_single_flow: true
  listener_state_pipe: false
  # The kernel module that hands cwnd control to the agent.
  listener_cc: astraea
  cport_base: 23000

algorithms:

  ma_td3:
    training:
      resume_from: null
      # Off-policy TD3 (the paper's MADDPG variant). Values from the tech
      # report's Table 4 (training parameters), astraea.json for the rest.
      # batch_size counts sampled joint windows; each contributes up to
      # `flows` per-agent transitions (~2-5x); 64 joint windows produce a
      # paper-sized batch near 192 transitions at the average flow count.
      batch_size: 192
      min_replay: 40000
      replay_capacity: 4000000     # astraea.json memsize
      gamma: 0.98                  # Table 4 gamma
      target_tau: 0.005            # astraea.json tau
      # Released astraea.json uses a much slower actor than critic.  Keeping
      # these distinct is essential: 1e-3 on the actor drives its tanh output
      # from one saturated boundary to the other instead of converging.
      lr_actor: 5.0e-5
      lr_critic: 1.0e-3
      # The released learner starts delayed actor updates as soon as replay
      # training starts; it has no additional critic-only warm-up phase.
      actor_warmup_steps: 0
      policy_delay: 20             # astraea.json policy_delay
      # Paper values (Table 4): model_update_interval_s: 5,
      # model_update_steps: 20 — 20 gradient iterations per 5 s of
      # collection. 0 = continuous mode (updates_per_step per loop) instead.
      # WARNING: interval 0 with updates_per_step 0 means the learner never
      # trains (this silently disabled learning in ma_td3_20260721-024424).
      # 10x hotter than Table 4 (20 steps / 5 s): same 20-step bursts, 10x
      # more often — ~40 updates/s, ~1 gradient step per ~23 fresh
      # transitions at 8 slots. Watch q_mean/critic_loss for drift; back off
      # to 1-2 s if Q slides while returns don't.
      model_update_interval_s: 5
      model_update_steps: 150
      # Target policy smoothing exactly as in the released agent
      # (get_target_actor_policy: N(0, 0.05) clipped to +/-0.1).
      target_noise_std: 0.05
      target_noise_clip: 0.1
      # 0 disables gradient clipping (the original agent used none).
      grad_clip: 1.0
      # In continuous mode (interval 0) the loop alternates queue-drain and
      # this many gradient steps. Not a paper parameter (the paper uses the
      # interval cadence above).
      updates_per_step: 8
      worker_push_every: 16
      save_every: 100
      param_broadcast_every: 50
      torch_threads: 4
      torch_interop_threads: 1
    agent:
      # Actor/critic widths: 3-layer MLP h1 -> h2 -> ceil(h2/2)
      # (astraea.json h1_shape/h2_shape; paper says 256/128/64).
      hidden: 256
      hidden2: 128
      # Paper/released value: batchnorm (TF layers.batch_normalization,
      # scale=False, after each hidden dense layer). layernorm is a non-paper
      # alternative kept for loading earlier Olympus checkpoints.
      actor_norm: batchnorm
      # w — MTPs of stacked local-state history (astraea.json rec_dim) and
      # the window of the fairness/stability reward metrics (Eq. 6-7).
      history_len: 5
      # MTP (Monitoring Time Period) — the agent's decision cadence: state is
      # aggregated over one MTP and one action applied per MTP. Table 4
      # value: 30ms. astraea_service.py (paper-baseline inference) is pinned
      # to the same 30ms so both benchmark arms act at this cadence.
      # Distinct from the benchmarks' measure_interval_s (iperf3 goodput
      # sampling) and the listener's scan_ms (socket discovery polling).
      interval_ms: 30
      cwnd_min: 10
      cwnd_max: 10000
      dead_flow_ms: 500
      # Released Astraea noise_type=0: with epsilon probability, replace the
      # actor output with U(-1, 1). Small action-index blocks are leased from
      # the learner so a new episode does not reset exploration.
      #
      # The effective global anneal budget is
      # random_exploration_steps * random_exploration_actors, with
      # epsilon = max(epsilon_end, 1 - global_action / effective_budget).
      # It must be sized against how many actions the RUN actually produces,
      # not wall-clock time.
      #
      # Calibrated for 2000 episodes with 2-5 flows: the completed 2-4-flow run
      # emitted 16.82M actions; scaling mean flows from 3.0 to 3.5 projects
      # ~19.63M actions. A 1.5M x 5 = 7.5M budget reaches epsilon=0.10 at
      # action 6.75M (~34% through the run), leaving ~66% at the exploration
      # floor for near-greedy refinement. Do not use 'auto' here: with
      # n_parallel=20 and mean_flows=3.5 it would select 70 and never anneal.
      exploration_mode: random_replacement
      random_exploration_steps: 1500000
      random_exploration_actors: 5
      random_epsilon_end: 0.10
      exploration_allocation_block: 256
    reward:
      # Paper Eq. 8 coefficients, confirmed by the tech report's Table 4:
      #   R = c0*R_thr - c1*R_lat - c2*R_loss - c3*R_fair - c4*R_stab
      # bounded to (-reward_clip, reward_clip). The paper reports the fairness
      # coefficient is robust in [0.05, 0.35] relative to c0.
      throughput_weight: 0.1    # c0
      latency_weight: 0.02      # c1
      loss_weight: 1.0          # c2
      # Doubled from the Table 4 value 0.02: with per-flow heterogeneous RTTs
      # our episodes put fairness and utilization in conflict, and at 0.02 the
      # fairness gradient (~0.003) loses to the utilization headroom (~0.02) —
      # jain sat flat at ~0.78 for both 20260719 runs. Still inside the
      # paper's robust c3/c0 range [0.05, 0.35] (0.04/0.1 = 0.4 is just past
      # it; the paper range was measured in RTT-homogeneous scenarios).
      fairness_weight: 0.25     # c3
      stability_weight: 0.01    # c4
      # beta in the (1+beta)*d0 latency threshold; d0 = the flow's observed
      # min_rtt (beta itself is not published in the paper/Table 4).
      delay_coefficient: 0.5
      reward_clip: 0.1
      # Upper bound on the raw R_lat term (before latency_weight). Deviation
      # from paper Eq. 5: on deep-buffer episodes (bdp_mult up to 16) a few ms
      # of bufferbloat with zero loss drives R_lat into the tens, so
      # latency_weight*R_lat (0.02*60 = 1.2) swamps the 0.1 throughput ceiling
      # and stores an ordinary CWND overshoot as the maximum -reward_clip
      # penalty. TD3's pessimistic actor then flees high CWND everywhere and
      # collapses to the CWND floor. reward_clip/latency_weight = 0.1/0.02 = 5
      # is where the clip already saturates, so capping here loses no gradient
      # and only removes the crater depth. Set very high to restore Eq. 5.
      latency_cap: 5.0
