# Olympus DreamerV3 — 100% RayNet simulation pre-training.
#
# The RayNet/OMNeT++ twin of olympus/dreamer.yaml: identical DreamerV3 learner,
# state, reward, action and network architecture; the ONLY difference is the
# collection backend — every transition comes from the RayNet simulator instead
# of Mininet emulation (RayNet tolerates running without root).
#
# INTENDED WORKFLOW (sim pre-train -> emulation fine-tune):
#   1. Train here on simulation until a checkpoint you like:
#        ./venv_training/bin/python olympus/train.py --config olympus/dreamer_simulation.yaml
#      (or via the orchestrator for the stratified multi-slot collection below:)
#        sudo -E env PATH="$PATH" HOME="$HOME" python3 olympus/orchestrator.py --config olympus/dreamer_simulation.yaml
#   2. Point the EMULATION config at that checkpoint and resume on Mininet:
#        # in olympus/dreamer.yaml -> algorithms.dreamer_v3.training.resume_from:
#        #   olympus/models/olympus/dreamer_v3_<sim-run>/checkpoints/dreamer_v3_<N>_cwnd_model.pt
#        sudo mn -c
#        sudo -E env PATH="$PATH" HOME="$HOME" ./venv_training/bin/python olympus/train.py --config olympus/dreamer.yaml
#
# WHY IT RESUMES CLEANLY: on resume the orchestrator copies this run's
# `algorithms.dreamer_v3` block (architecture + training) from the checkpoint's
# saved config, but deliberately keeps the resuming config's environment /
# outputs / paths. So the emulation run inherits the sim-trained weights and
# hyperparameters while collecting from Mininet. For the load to line up, the
# `runtime` (state/reward/action) and the `agent` architecture block here MUST
# stay byte-for-byte identical to olympus/dreamer.yaml — they are.

runtime:
  algorithm: dreamer_v3
  reward: dreamer
  state: dreamer
  action: cwnd_multiplier

# Action mappings are selected independently of the learner. Both plugins keep
# the policy output one-dimensional in [-1, 1].
actions:
  # Exponential relative CWND multiplier. With the range below,
  # -1 -> 0.5x, 0 -> 1.0x, +1 -> 2.0x.
  cwnd_multiplier:
    action_min: -1.0
    action_max: 1.0
    multiplier_min: 0.5
    multiplier_max: 2.0
    min_cwnd_change: 1
  # Original Astraea-style small relative adjustment.
  astraea:
    action_min: -1.0
    action_max: 1.0
    step: 0.025

# RayNet/OMNeT++ backend. `dreamer` is the scenario at
# environments/raynet/dreamer.yaml — the same 30s single-flow sweep as the
# Mininet `dreamer` setup, plus the raw-TCP observation_fields the bridge needs.
# Used by the single-process train.py path; the orchestrator uses the
# `experience_collection` block below instead (which selects the same env).
environment:
  type: raynet
  environment_setup: dreamer

# ── Experience collection ─────────────────────────────────────────────────────
# Single simulation collection group, so batch_fraction = 1.0. BDP-stratified
# replay: RayNet finishes low-bandwidth episodes far faster in wall-clock, so a
# single FIFO sim buffer fills with low-BDP / low-cwnd transitions and evicts the
# rare high-BDP experience. One reserved sub-buffer per bandwidth-delay-product
# class (bw*rtt in Mbps*ms), sampled evenly, keeps every link regime represented
# regardless of how quickly it is produced. `n_buckets` lets the orchestrator
# auto-derive quantile edges from the `dreamer` sweep (bws x delays), capped at
# the number of distinct BDP products; pin exact edges with `bdp_edges: [...]`.
experience_collection:
  enabled: true
  raynet:
    environment_setup: dreamer
    n_parallel: 20
    # Total capacity, split evenly across the BDP classes; matches the flat
    # replay_capacity so the stratified footprint is unchanged.
    buffer_capacity: 400000
    batch_fraction: 1.0
    strata:
      n_buckets: 20

reward:
  delay_margin_coef: 1.25
  # Every three seconds, reward the ratio-based closeness of raw min_rtt to the
  # current scheduled base RTT. There is no tolerance or cutoff.
  min_rtt_bonus: 20.0
  # Fairness fields below are used only by fairness rewards (multi-agent); inert
  # for the single-agent Dreamer reward, kept for a unified superset.
  fairness_metric: r_fair
  w_r_fair: 25.0
  r_fair_cap: 1.0
  w_jain: 25.0

# BBR3-style independent cwnd probe. Algorithm- and reward-agnostic; every worker
# honours it when enabled.
bbr_probe:
  enabled: false
  interval_s: 5.0
  duration_s: 0.2
  factor: 0.5

state_options:
  # Used only by runtime.state: orca — Orca's fixed delay target feature.
  orca_target_ms: 50.0
  # Dreamer is stateless and has no Kalman/min_rtt options.

paths:
  listener: olympus/oc_bridge
  py: ./venv_training/bin/python
  # RayNet/OMNeT++ paths auto-resolve to the vendored submodules under
  # olympus/environments/raynet/sim/ ; set raynet_path/omnet_path here to override.

outputs:
  # Kept under the same root as dreamer.yaml so the sim checkpoint sits next to
  # the emulation runs that will resume from it.
  root: olympus/models/olympus
  run_name:
  # Worker CSV traces always go to episodes/. Render every completed simulation
  # episode into plots/.
  plot_episodes: true
  plot_every_n: 1
  require_state_logs: true

# ── Orchestrator ──────────────────────────────────────────────────────────────
# Runner-level knobs: episode dispatch, checkpoint snapshots, the learner RPC
# port, and the oc_bridge listener. (Older configs may keep these keys flat at
# the top level; the orchestrator reads both layouts.)
orchestrator:
  # Fallback parallelism; the simulation slot count is set in
  # experience_collection.raynet.n_parallel above.
  n_parallel: 20
  # Hard cap on total dispatched episodes; omit / null to run until interrupted.
  episodes: 1000
  # Copy an immutable snapshot of the rolling checkpoint (e.g.
  # checkpoints/<alg>_<N>_cwnd_model.pt) every N completed episodes, whatever
  # the algorithm. The copy runs in a background thread so it never delays the
  # rolling checkpoint or episode dispatch. 0 / null disables snapshots.
  save_every_episodes: 100
  # TCP port of the learner's parameter/replay manager.
  learner_port: 6301
  # oc_bridge listener: `ss` scan period.
  scan_ms: 20
  # When true, oc_bridge attaches the first matching worker and never connects
  # another during that listener lifetime.
  listener_single_flow: true
  # Workers read TCP state from tcp_sockopt directly; the listener need not emit.
  listener_state_pipe: false
  # On RayNet the listener_cc name selects the underlying tcpAlgorithmClass under
  # the DeepCC RL wrapper (RAYNET_CC_ALGO_BY_LISTENER in environments/raynet/env.py):
  # `astraea` -> TcpPacedNoCC, i.e. pure-RL cwnd control from the start (no CUBIC
  # slow-start handoff), matching Dreamer's full-control agent.
  listener_cc: astraea
  cport_base: 23000

algorithms:


  dreamer_v3:
    training:
      resume_from: null
      batch_size: 16
      seq_len: 48
      min_replay: 1
      replay_capacity: 400000
      grad_clip: 1000.0
      updates_per_step: 1
      save_every: 100
      param_broadcast_every: 50
      kl_weight: 1.0
      kl_balance: 0.8
      kl_free_bits: 1.0
      recon_weight: 1.0
      reward_weight: 1.0
      continue_weight: 1.0
      lr_world: 1.0e-4
      lr_actor: 3.0e-5
      lr_critic: 3.0e-5
      horizon: 15
      gamma: 0.99
      lam: 0.95
      entropy_coef: 3.0e-3
      action_l2_coef: 2.0e-2
      action_smooth_coef: 2.0e-2
      actor_log_std_min: -2.0
      actor_log_std_max: 0.0
      target_tau: 0.02
      actor_warmup_steps: 1000
      value_bins: 255
      value_low: -20.0
      value_high: 20.0
      reward_bins: 255
    agent:
      hidden: 256
      embed_dim: 128
      h_dim: 256
      latent_groups: 8
      latent_classes: 8
      reward_bins: 255
      interval_ms: 20
      cwnd_min: 10
      cwnd_max: 10000
      dead_flow_ms: 500
      noise_start: 0.2
      noise_end: 0.05
      noise_decay_episodes: 300
