# Mixed emulation + simulation training for Orca.
#
# A single learner is fed by every environment declared under
# experience_collection at once:
#   - mininet:  Mininet (real Linux kernel), n_parallel slots
#   - raynet:   RayNet/OMNeT++,              n_parallel slots
# The learner keeps a separate replay buffer per environment and samples each
# minibatch as a blend controlled by the per-environment batch_fraction.
#
# Run (needs root for the Mininet pool; RayNet tolerates it):
#   sudo mn -c
#   sudo -E env PATH="$PATH" HOME="$HOME" \
#     ./venv_training/bin/python olympus/train.py --config olympus/config_mixed_orca.yaml

runtime:
  algorithm: orca
  reward: tempest
  state: tempest
  action: cwnd_multiplier

actions:
  cwnd_multiplier:
    action_min: -1.0
    action_max: 1.0
    multiplier_min: 0.25
    multiplier_max: 4.0
    min_cwnd_change: 1

# Top-level environment is only used for pre-flight (it makes the orchestrator
# load the Mininet listener + kernel CC). The actual collection environments are
# the blocks under experience_collection below.
environment:
  type: mininet
  environment_setup: dynamic

# Unsynchronised collection: emulation and simulation slots each run at their own
# pace (no cross-slot step barrier). This is the default, pinned here explicitly.
# The fast RayNet slots outrunning the Mininet ones is expected and handled on the
# learning side by the per-source mix fraction plus the BDP-stratified sim buffer
# below, not by lock-stepping collection.
synchronized_collection: false

# ── Experience collection ─────────────────────────────────────────────────────
# One block per collection environment type (any number). batch_fraction is the
# share of every training minibatch drawn from that environment's buffer;
# required on every block, and the fractions must sum to 1 or the run aborts.
experience_collection:
  enabled: true
  mininet:
    environment_setup: dynamic       # one flow under changing BW/RTT
    n_parallel: 6
    # Total replay capacity (transitions) for this environment's buffer.
    # Falls back to the algorithm's replay_capacity.
    buffer_capacity: 10240
    batch_fraction: 0.5
  raynet:
    environment_setup: orca_static    # RayNet Orca sweep
    n_parallel: 6
    # Total capacity, split evenly across the BDP classes below.
    buffer_capacity: 10240
    batch_fraction: 0.5
    # BDP-stratified simulation replay. RayNet finishes low-bandwidth episodes
    # far faster in wall-clock, so a single FIFO sim buffer fills with low-BDP /
    # low-cwnd transitions and evicts the rare high-BDP experience. Instead we
    # keep one reserved sub-buffer per bandwidth-delay-product class (bw*rtt in
    # Mbps*ms) and sample every class evenly, so all link regimes stay
    # represented regardless of how quickly they are produced. Emulation is never
    # stratified.
    #
    # Just set n_buckets: the orchestrator reads the simulation sweep
    # (orca_static.yaml bws x delays) and auto-derives quantile edges so each
    # bucket holds a similar share of link combinations. The resolved edges are
    # written into telemetry/config.resolved.yaml. To pin exact edges instead,
    # set `bdp_edges: [...]` here (that always overrides n_buckets).
    strata:
      n_buckets: 20

reward:
  delay_margin_coef: 1.25

state_options:
  orca_target_ms: 50.0

paths:
  listener: olympus/oc_bridge
  py: ./venv_training/bin/python
  # raynet_path/omnet_path auto-resolve to the vendored submodules under
  # olympus/environments/raynet/sim/ ; set them here only to override.

listener_cc: astraea

outputs:
  root: olympus/models/orca
  run_name: mixed_orca_every_episode
  # Worker CSV traces are always written to episodes/. Render every completed
  # emulation and simulation episode into plots/.
  plot_episodes: true
  plot_every_n: 1
  require_state_logs: true

# Per-environment parallelism is set inside experience_collection; this is just a fallback.
n_parallel: 6
episodes: 160000

algorithms:
  orca:
    training:
      resume_from: null
      batch_size: 8
      min_replay: 10000
      replay_capacity: 10240          # each of the two buffers gets this capacity
      gamma: 0.995
      target_tau: 0.001
      lr_actor: 1.0e-4
      lr_critic: 1.0e-3
      actor_update_every: 1
      target_noise_std: 0.1
      target_noise_clip: 0.2
      grad_clip: 0.0
      updates_per_step: 1
      save_every: 100000
      save_every_episodes: 0
      param_broadcast_every: 1
      update_delay_ms: 20
      persist_replay_on_stop: false
    agent:
      hidden: 64
      head_hidden: 64
      interval_ms: 20
      cwnd_min: 4
      cwnd_max: 10000
      noise_std: 0.0
      noise_start: 0.0
      noise_end: 0.0
      noise_decay_episodes: 1
