name: multiflow_interleave_rtt
description: >
  Like multiflow_interleave (up to N flows join/leave on one shared bottleneck),
  but every flow propagates at its OWN base RTT: each flow's one-way delay is a
  random multiple of the selected environment's base RTT, drawn uniformly in
  [per_flow_rtt_mult_min, per_flow_rtt_mult_max] (default 0.20x .. 5.0x) per
  flow, per episode. The shared s1-s2 link then carries no propagation delay and
  each flow's RTT lives on its own sender access link (see `per_flow_delays` in
  environments/mininet/env.py), so flows with very different RTTs contend on the
  same bottleneck — an inter-RTT-fairness stress test on top of the interleave
  join/leave dynamics. Multi-agent algorithms (mat, ma_dreamer) train every flow
  jointly; single-agent algorithms run the extra flows as lagged self-play.
shuffle: true

sweep:
  bw_range:    [20, 100]
  bw_step:     10
  delay_range: [10, 80]
  delay_step:  10
  bdp_mult: [4]
  # Concurrent flows (agents) per slot. A list sweeps all listed counts, padding
  # smaller-N episodes with masks. The count is NOT hard-coded — adjust freely:
  #   [1, 2, 3, 4]  up to 4 (default)   |   [1, 2]  up to 2   |   [4]  exactly 4.
  flows:    [1, 2, 3, 4]
  # ── Per-flow base-RTT diversity ──────────────────────────────────────────
  # When on, each flow's one-way delay = base delay * U(min, max), sampled once
  # per flow per episode. Set min/max to widen or narrow the RTT spread.
  per_flow_rtt_mult: true
  per_flow_rtt_mult_min: 0.20
  per_flow_rtt_mult_max: 5.0
  # Flow start stagger: 'simul' | 'half_late' | 'random'.
  agent_join_pattern: random
  agent_join_max_frac: 0.2
  # Random per-flow lifetimes (one flow always survives to episode end).
  flow_lifetime_pattern: random
  flow_lifetime_min_frac: 0.25
  flow_lifetime_max_frac: 0.9
  flow_lifetime_keep_one: true
  duration: 120
  # NOTE: delay_frac schedules scale each flow's OWN access-link delay (and its
  # reward reference rtt_ref) by the given fraction of the episode base — see
  # MininetEnv.set_link and orchestrator._flow_link_schedule. Inter-flow RTT
  # heterogeneity (per_flow_rtt_mult) is preserved through changes: every
  # flow's RTT moves by the same fraction of its own base.
  link_schedules:
    # ── 7-change / 15s cadence: BW only ──────────────────────────────────────
    - [{t: 15, bw_frac: 0.5},  {t: 30, bw_frac: 1.0}, {t: 45, bw_frac: 0.5},  {t: 60, bw_frac: 1.0}, {t: 75, bw_frac: 0.5},  {t: 90, bw_frac: 1.0}, {t: 105, bw_frac: 0.5}]
    - [{t: 15, bw_frac: 2.0},  {t: 30, bw_frac: 1.0}, {t: 45, bw_frac: 2.0},  {t: 60, bw_frac: 1.0}, {t: 75, bw_frac: 2.0},  {t: 90, bw_frac: 1.0}, {t: 105, bw_frac: 2.0}]
    - [{t: 15, bw_frac: 0.75}, {t: 30, bw_frac: 1.5}, {t: 45, bw_frac: 0.5},  {t: 60, bw_frac: 2.0}, {t: 75, bw_frac: 0.75}, {t: 90, bw_frac: 1.5}, {t: 105, bw_frac: 0.5}]
    # ── Single change / static ───────────────────────────────────────────────
    - [{t: 15, bw_frac: 0.5}]
    - [{t: 15, bw_frac: 2.0}]
    - []
