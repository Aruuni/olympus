name: lagged_fairness_smoke
description: Short RayNet lagged-policy fairness smoke test.
shuffle: false

sweep:
  protocol: Astraea
  ini_path: /home/james/raynet/_environments/lagged_fairness/config_lagged_fairness.ini
  section: General
  bws: [10]
  delays: [20]
  bdp_mult: 1
  duration: 3
  flows: 1
  measure_interval_s: 0.1
  per_flow_state_logs: true
  unique_cports: false
  listener_single_flow: false
  lagged_policy:
    enabled: true
    extra_flows: [1]
    join_time_min_s: 0.5
    join_time_max_s: 1.0
    lag_episodes: 1
    deterministic: true
    disable_learning: true
    require_checkpoint: false
  link_schedules:
    - [{t: 1, bw_frac: 0.5}, {t: 2, bw_frac: 1.0}]
