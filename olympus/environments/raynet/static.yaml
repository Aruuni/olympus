name: static
description: Steady-link sweep. Each episode samples one BW/RTT pair and has no link schedule changes.
shuffle: true

sweep:
  ini_path: _environments/base_environment.ini   # DeepCC unified env (relative to raynet_path)
  # RayNet Meta parameters
  protocol: Orca
  section: General

  bws: [10]
  delays: [20]
  bdp_mult: 1
  flows: 1
  duration: 120
  link_schedules:
    - []
