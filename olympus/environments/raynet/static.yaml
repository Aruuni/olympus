name: static
description: Steady-link sweep. Each episode samples one BW/RTT pair and has no link schedule changes.
shuffle: true

sweep:
  # RayNet Meta parameters
  protocol: Orca
  ini_path: ~/extra/raynet_olympus/_environments/static/config_static.ini
  section: General

  bws: [10]
  delays: [20]
  bdp_mult: 1
  flows: 1
  duration: 120
  link_schedules:
    - []
