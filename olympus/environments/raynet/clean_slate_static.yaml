name: clean_slate_static
description: RayNet CleanSlate steady-link episodes with Astraea-compatible raw TCP observations.
shuffle: true

sweep:
  ini_path: _environments/base_environment.ini   # DeepCC unified env (relative to raynet_path)
  protocol: CleanSlate
  section: General
  flows: 1
  bws: [10, 20, 30, 40, 50]
  delays: [10, 20, 30, 40, 50]
  bdp_mult: 1
  duration: 10
  observation_fields:
    - {name: avg_thr, index: 0, aliases: [throughput]}
    - {name: avg_urtt, index: 1, aliases: [delay_us]}
    - {name: min_rtt, index: 2, aliases: [min_rtt_us]}
    - {name: srtt_us, index: 3}
    - {name: cwnd, index: 4}
    - {name: packets_out, index: 5}
    - {name: pacing_rate, index: 6}
    - {name: retrans_out, index: 7}
  link_schedules:
    - []
