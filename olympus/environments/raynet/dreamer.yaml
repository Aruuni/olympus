name: dreamer
description: >
  RayNet equivalent of the Dreamer Mininet sweep. Episodes last 30 seconds and
  have at most one link event at 15 seconds. Bandwidth-only, RTT-only, combined,
  and unchanged conditions are equally represented.
shuffle: true

sweep:
  bws: [10, 20, 40, 60, 80, 100]
  delays: [10, 20, 40, 60, 80]
  bdp_mult: [4]
  flows: 1
  duration: 30
  observation_fields:
    - {name: avg_thr, index: 0, aliases: [throughput]}
    - {name: avg_urtt, index: 1, aliases: [delay_us]}
    - {name: min_rtt, index: 2, aliases: [min_rtt_us]}
    - {name: srtt_us, index: 3}
    - {name: cwnd, index: 4}
    - {name: packets_out, index: 5}
    - {name: pacing_rate, index: 6}
    - {name: retrans_out, index: 7}
  link_schedules:
    # Bandwidth only (4/16 conditions).
    - [{t: 15, bw_frac: 0.5}]
    - [{t: 15, bw_frac: 0.75}]
    - [{t: 15, bw_frac: 1.5}]
    - [{t: 15, bw_frac: 2.0}]

    # RTT only (4/16 conditions).
    - [{t: 15, delay_frac: 0.5}]
    - [{t: 15, delay_frac: 1.5}]
    - [{t: 15, delay_frac: 2.0}]
    - [{t: 15, delay_frac: 3.0}]

    # Bandwidth and RTT together (4/16 conditions).
    - [{t: 15, bw_frac: 0.5, delay_frac: 0.5}]
    - [{t: 15, bw_frac: 0.5, delay_frac: 2.0}]
    - [{t: 15, bw_frac: 2.0, delay_frac: 0.5}]
    - [{t: 15, bw_frac: 2.0, delay_frac: 2.0}]

    # Neither changes (duplicated to give this mode the same 4/16 weight).
    - []
    - []
    - []
    - []
