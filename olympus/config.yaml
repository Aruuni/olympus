# Olympus configuration (single-agent and multi-agent share this file).
#
# Run:
#   sudo mn -c
#   sudo -E env PATH="$PATH" HOME="$HOME" python3 olympus/orchestrator.py --config olympus/config.yaml
#
# The mode is chosen entirely by runtime.algorithm. Algorithms that declare
# MULTI_AGENT = True (ma_dreamer, ma_td3) run as true multi-agent over the `sweep`
# flow counts; single-agent algorithms (td3, orca, dreamer_v3, …) run the
# selected `environment`, and any environment with >1 flow becomes lagged
# self-play automatically.
#
#   Single-agent preset (default):  algorithm: dreamer_v3  reward: tempest               state: oracle
#   Multi-agent preset:             algorithm: ma_dreamer  reward: tempest_fairness_ma   state: tempest
#                                   (or algorithm: ma_td3) — multi-agent uses the `sweep` block at the bottom.
#   Multi-agent credit variant:     reward: tempest_fairness_ma_symetric — worker throughput
#                                   term peaks AT the fair share (overshoot penalized, like
#                                   the RTT term); learner keeps the Astraea-style single
#                                   shared team scalar. Optional per-agent credit assignment
#                                   via reward.per_agent_credit (team_alpha / over_weight).

runtime:
  algorithm: ma_dreamer
  reward: tempest_fairness_ma
  state: tempest_ratio
  action: cwnd_multiplier


# runtime:
#   algorithm: ma_dreamer
#   reward: tempest_fairness_ma
#   state: tempest
#   action: cwnd_multiplier

# Action mappings are selected independently of the learner. Both current
# plugins keep the policy output one-dimensional in [-1, 1], so changing the
# action changes its TCP meaning without changing the actor network shape.
actions:
  # Existing Olympus action: exponential relative CWND multiplier.
  # -1 -> 0.5x, 0 -> 1.0x, +1 -> 2.0x.
  cwnd_multiplier:
    action_min: -1.0
    action_max: 1.0
    #multiplier_min: 0.5
    #multiplier_max: 2.0
    multiplier_min: 0.8
    multiplier_max: 1.2
    min_cwnd_change: 1

  # Original Astraea-style small relative adjustment. At step=0.025,
  # +1 requests +2.5%; -1 requests the reciprocal decrease 1/1.025.
  astraea:
    action_min: -1.0
    action_max: 1.0
    step: 0.025

  # Additive flat step: delta = step * action (independent of current cwnd).
  # step=20 -> +1 gives +20, -1 gives -20, 0 holds. Set discrete: true for
  # bang-bang +/- step by the action's sign (deadzone holds near 0).
  cwnd_delta:
    action_min: -1.0
    action_max: 1.0
    step: 20
    discrete: false
    deadzone: 0.0

environment:
  # `type` selects the emulator backend; its definitions live in
  # olympus/environments/<type>/. `environment_setup` is the scenario file
  # (<environment_setup>.yaml) within that folder. Override the scenario at
  # runtime with `--environment <name>` and the backend with `--env-type <type>`.
  #
  # type: mininet            link + traffic emulation via Mininet (the backend
  #                          provided today). environment_setup options:
  #   multiflow_interleave  up to N flows join at random times and leave after
  #                         random lifetimes (multi-agent joint training, or
  #                         lagged self-play under a single-agent algorithm).
  #   multiflow_interleave_rtt  same join/leave dynamics, but each flow
  #                         propagates at its own base RTT (one-way delay =
  #                         base delay * U(0.20, 5.0) per flow per episode).
  #   dynamic               one flow under changing BW/RTT link schedules.
  #   static                one flow on a steady link (no schedule changes).
  #   lagged_fairness       one flow plus lagged-policy background flows (join only).
  type: mininet
  environment_setup: multiflow_interleave_rtt_memes

reward:
  delay_margin_coef: 1.25
  # Fairness penalty (tempest_fairness reward only). Both metrics are
  # single-agent surrogates (link fully utilized; other n-1 flows split the
  # rest equally) and are always logged; fairness_metric picks which one is
  # subtracted from the returned reward.
  #   r_fair: Astraea CoV metric |avg_thr - fair_share|/(sqrt(n-1)*link_bw)
  #   jain:   classic Jain index, applied as a (1 - Jain) penalty
  fairness_metric: r_fair   # r_fair | jain
  w_r_fair: 25.0       # weight for r_fair (in [0, ~0.5]); penalty up to ~w_r_fair/2
  r_fair_cap: 1.0      # clamp on r_fair before weighting (rarely binds)
  w_jain: 25.0         # weight for (1 - Jain) (in [0, ~1-1/n])

# BBR3-style independent cwnd probe. Algorithm- and reward-agnostic — every
# worker (orca, td3, mbpo_td3, recurrent_ppo, dreamer_v3)
# honours it when enabled. Every interval_s the worker drops cwnd to
# factor*cwnd for duration_s, then restores it; the agent cannot change cwnd
# while the probe is active. Maintains a windowed min-RTT filter internally
# — NOT exposed to the agent's observation.
bbr_probe:
  enabled: false
  interval_s: 5.0
  duration_s: 0.2
  factor: 0.5
  min_rtt_window_s: 5.0



state_options:
  # Used only by runtime.state: orca. This is Orca's fixed delay target feature,
  # not the scheduled/emulated RTT.
  orca_target_ms: 50.0
  # Used only by runtime.state: tempest (the multi-agent default state).
  tempest_kalman:
    init_us: 20000.0
    q: 5.0e-4
    r_down: 1.0e-3
    r_up: 5.0
    jump_thresh: 1.5

paths:
  listener: olympus/oc_bridge
  py: ./venv_training/bin/python

outputs:
  # Each invocation creates:
  #   <root>/<runtime.algorithm>_<YYYYmmdd-HHMMSS>/
  #     checkpoints/
  #     episodes/
  #     plots/
  #     telemetry/
  root: olympus/models
  # Optional: set run_name to force a specific folder name under root.
  # run_name: debug_run
  # Set false to skip per-episode PDFs in plots/ (episode_returns.csv and
  # telemetry/episode_returns.pdf are still generated).
  plot_episodes: false

# ── Orchestrator ──────────────────────────────────────────────────────────────
# Runner-level knobs: episode dispatch, checkpoint snapshots, the learner RPC
# port, and the oc_bridge listener. (Older configs may keep these keys flat at
# the top level; the orchestrator reads both layouts.)
orchestrator:
  # Parallel episode slots.
  n_parallel: 20
  # Hard cap on total dispatched episodes. The orchestrator stops handing out
  # new work once this many have been launched and lets in-flight slots drain.
  # Omit (or set null) to run until interrupted.
  episodes: 5000
  # Copy an immutable snapshot of the rolling checkpoint (e.g.
  # checkpoints/<alg>_<N>_cwnd_model.pt) every N completed episodes, whatever
  # the algorithm. The copy runs in a background thread so it never delays the
  # rolling checkpoint or episode dispatch. 0 / null disables snapshots.
  save_every_episodes: 500
  # TCP port of the learner's parameter/replay manager.
  learner_port: 6301
  # oc_bridge listener: `ss` scan period.
  scan_ms: 20
  # When true, oc_bridge attaches the first matching worker, stops scanning
  # `ss`, and never connects another worker during that listener lifetime.
  listener_single_flow: true
  # Workers read TCP state from tcp_sockopt directly, so the listener does not
  # need to emit and the workers do not need to drain OC_STATE_FD frames.
  listener_state_pipe: false
  # Congestion-control name that the local listener scans for. This is exported
  # to the listener through the environment, not as a listener CLI argument.
  listener_cc: astraea
  cport_base: 23000

algorithms:

  td3:
    training:
      # The orchestrator rewrites checkpoint and log_path into the current run dir.
      # Set to resume from an existing TD3 checkpoint without overwriting it.
      resume_from: null
      # Vanilla TD3 uses the same tuned TD3 settings as mbpo_td3. MBPO-only
      # forward-model and imagined-rollout knobs stay in the mbpo_td3 block.
      batch_size: 256
      seq_len: 32
      min_replay: 5000
      replay_capacity: 400000
      gamma: 0.99
      target_tau: 0.005
      lr_actor: 1.0e-4
      lr_critic: 1.0e-3
      # Step-decay critic LR after this many gradient updates to slow TD3
      # underestimation drift. ~250k steps ≈ 500 episodes at our throughput.
      # Set lr_critic_decay_after_steps: 0 to disable.
      lr_critic_decay_after_steps: 250000
      lr_critic_final: 3.0e-4
      policy_delay: 2
      target_noise_std: 0.2
      target_noise_clip: 0.5
      grad_clip: 5.0
      updates_per_step: 1
      save_every: 500
      # Immutable episode snapshots (checkpoints/td3_<N>_cwnd_model.pt) are
      # governed by orchestrator.save_every_episodes above.
      param_broadcast_every: 50
      # Set false to train on raw reward magnitudes instead of dividing TD
      # targets by the running reward std.
      use_reward_normalizer: true
    agent:
      hidden: 128
      interval_ms: 20
      cwnd_min: 10
      cwnd_max: 10000
      dead_flow_ms: 500
      # Generic recurrent TD3 exploration schedule.
      noise_start: 0.3
      noise_end: 0.05
      noise_decay_episodes: 300

  mbpo_td3:
    training:
      # The orchestrator rewrites checkpoint and log_path into the current run dir.
      resume_from: null
      batch_size: 256
      seq_len: 32
      min_replay: 5000
      replay_capacity: 400000
      gamma: 0.99
      target_tau: 0.005
      lr_actor: 1.0e-4
      lr_critic: 1.0e-3
      lr_critic_decay_after_steps: 250000
      lr_critic_final: 3.0e-4
      policy_delay: 2
      target_noise_std: 0.2
      target_noise_clip: 0.5
      grad_clip: 5.0
      updates_per_step: 1
      save_every: 500
      param_broadcast_every: 50
      # ── MBPO knobs ────────────────────────────────────────────────────────
      # Forward-model ensemble that imagines short rollouts to refresh the
      # critic with on-policy targets. See algorithms/mbpo_td3/learner.py.
      model_hidden: 200
      model_ensemble_size: 5
      model_lr: 1.0e-3
      model_batch_size: 256
      model_train_every: 250        # gradient updates between model-train cycles
      model_epochs: 5               # epochs per model-train cycle
      rollout_horizon: 5            # imagined steps per branched trajectory
      rollouts_per_cycle: 1000      # number of real states branched each cycle
      rollout_every: 250            # gradient updates between rollout cycles
      rollout_noise_std: 0.1        # exploration noise added to imagined actions
      model_buffer_capacity: 400000
      real_ratio: 0.5               # fraction of each TD3 batch drawn from real
      model_min_real: 5000          # don't train model until real_buf >= this
    agent:
      hidden: 128
      interval_ms: 20
      cwnd_min: 4
      cwnd_max: 10000
      dead_flow_ms: 500
      noise_start: 0.3
      noise_end: 0.05
      noise_decay_episodes: 300

  dreamer_v3:
    training:
      # The orchestrator rewrites checkpoint and log_path into the current run dir.
      resume_from: null
      # Sequence batch shape: B sequences of length T. With our 50 Hz collection
      # 16 × 48 ≈ 1 second of trace per sequence — wide enough to capture a few
      # link schedule effects, narrow enough to keep RSSM unrolls fast.
      batch_size: 16
      seq_len: 48
      min_replay: 5000
      replay_capacity: 400000
      grad_clip: 1000.0
      updates_per_step: 1
      save_every: 500
      param_broadcast_every: 50
      # World model joint loss weights + KL settings (DreamerV3 defaults).
      kl_weight: 1.0
      kl_balance: 0.8
      kl_free_bits: 1.0
      recon_weight: 1.0
      reward_weight: 1.0
      continue_weight: 1.0
      # Optimisers: world model gets the largest LR; actor/critic are gentler.
      lr_world: 1.0e-4
      lr_actor: 3.0e-5
      lr_critic: 3.0e-5
      # Imagination + actor-critic
      horizon: 15
      gamma: 0.99
      lam: 0.95
      entropy_coef: 3.0e-3
      action_l2_coef: 2.0e-2
      action_smooth_coef: 2.0e-2
      actor_log_std_min: -2.0
      actor_log_std_max: 0.0
      target_tau: 0.02
      actor_warmup_steps: 1000
      # Twohot value/reward bin grid (in symlog space).
      value_bins: 255
      value_low: -20.0
      value_high: 20.0
      reward_bins: 255
    agent:
      hidden: 256          # MLP / head width for everything in the world model
      embed_dim: 128       # encoder output dim that feeds the RSSM posterior
      h_dim: 256           # GRU deterministic state width
      latent_groups: 8     # K — number of categorical groups in the stochastic latent
      latent_classes: 8    # C — classes per group; latent_dim = K × C
      reward_bins: 255
      interval_ms: 20
      cwnd_min: 10
      cwnd_max: 10000
      dead_flow_ms: 500
      # Exploration is built into the actor's TanhNormal sample at rollout time;
      # the noise_decay schedule is inherited from the orchestrator only for
      # consistency with other algorithms (the worker ignores noise_std).
      noise_start: 0.2
      noise_end: 0.05
      noise_decay_episodes: 300

  # ── Multi-agent algorithms (MULTI_AGENT = True) ──────────────────────────────
  # Selected via runtime.algorithm. They train every flow jointly and use the
  # `sweep` block (flow counts, join/lifetime patterns) at the bottom of this
  # file. Each carries its own `reward:` sub-block, which overrides the global
  # single-agent `reward:` block above.
  ma_dreamer:
    training:
      resume_from: null
      batch_size: 128
      seq_len: 48
      min_replay: 50000
      replay_capacity: 400000
      updates_per_step: 1
      worker_push_every: 16
      save_every: 200
      param_broadcast_every: 25
      grad_clip: 100.0
      # Local Tempest RSSM + global joint RSSM losses.
      kl_weight: 1.0
      kl_balance: 0.8
      kl_free_bits: 1.0
      recon_weight: 1.0
      reward_weight: 1.0
      continue_weight: 1.0
      local_world_weight: 1.0
      global_world_weight: 1.0
      latent_h_weight: 1.0
      latent_z_weight: 1.0
      lr_world: 1.0e-4
      lr_actor: 3.0e-5
      lr_critic: 3.0e-5
      horizon: 15
      gamma: 0.99
      lam: 0.95
      entropy_coef: 3.0e-3
      action_l2_coef: 2.0e-2
      action_smooth_coef: 2.0e-2
      actor_log_std_min: -2.0
      actor_log_std_max: 0.0
      target_tau: 0.02
      actor_warmup_steps: 1000
      value_bins: 255
      value_low: -20.0
      value_high: 20.0
      reward_bins: 255
      torch_threads: 2
      torch_interop_threads: 1
    agent:
      hidden: 256
      embed_dim: 128
      h_dim: 256
      latent_groups: 8
      latent_classes: 8
      global_hidden: 256
      global_embed_dim: 128
      global_h_dim: 256
      global_latent_groups: 8
      global_latent_classes: 8
      interval_ms: 20
      cwnd_min: 4
      cwnd_max: 10000
      dead_flow_ms: 500
      noise_start: 0.2
      noise_end: 0.05
      noise_decay_episodes: 300
    reward:
      # Attached unfairness metric, computed from all active flows' avg_thr:
      # sqrt(sum_i (avg_thr_i - mean(avg_thr))^2 / (n * sum_i(avg_thr_i)^2)).
      # A cost (zero is perfectly fair) subtracted from the mean Tempest reward.
      fairness_metric: r_fair_avg_throughput
      fairness_weight: 8.0
      fairness_cap: 1.0
      # Optional per-agent credit assignment (off by default; the learner
      # uses the Astraea-style shared team scalar). When true, each agent
      # trains on
      #   R_i = team_alpha*r_i + (1-team_alpha)*mean(r)
      #         - fairness_weight*min(R_fair, fairness_cap)
      #         - over_weight*max(0, thr_i - mean(thr))/sum(thr)
      # so only the flow above its fair share pays the targeted penalty.
      # Changes the global reward head to one output per agent (checkpoints
      # not compatible with shared-scalar runs).
      per_agent_credit: true
      team_alpha: 0.5
      over_weight: 50.0

# The episode pool — base bottleneck/RTT sweep, flow counts, join/leave churn, and
# link schedules — now lives in olympus/environments/<type>/*.yaml and is chosen by
# the `environment:` selection (type + environment_setup) near the top of this
# file, for BOTH single- and multi-agent algorithms. The multi-flow join/leave
# sweep that used to sit here is now
# olympus/environments/mininet/multiflow_interleave.yaml.
